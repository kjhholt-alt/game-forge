 # Story cycle visualization
 SECOND_ROME_RIVAL_LABEL:0 "Denies Your Claim"
 second_rome_legitimacy_counter_label:0 "Restorer's Legitimacy"
 SECOND_ROME_LEGITIMACY_COUNTER_TOOLTIP:0 "How widely your claim to the old empire's mantle is believed, from open mockery to unquestioned acclaim."
 SECOND_ROME_LEGITIMACY_MIN_LABEL:0 "Hollow Crown"
 SECOND_ROME_LEGITIMACY_MAX_LABEL:0 "Restorer Acclaimed"

 # saga_second_rome.1000 -- The Weight of the Purple
 saga_second_rome.1000.t:0 "The Weight of the Purple"
 saga_second_rome.1000.desc:0 "The imperial crown sits on your brow now, heavier than any count's coronet ever was. Yet a title copied onto parchment is not the same as a title believed in the hearts of other rulers -- or your own court. Already you sense the whispers: usurper, upstart, pretender."
 saga_second_rome.1000.a:0 "Let them call me pretender. I will make them believe it."
 saga_second_rome.1000.b:0 "Legitimacy is proven through years of just rule, not proclamation."

 # saga_second_rome.1001 -- Whispers in the Court
 saga_second_rome.1001.t:0 "Whispers in the Court"
 saga_second_rome.1001.desc:0 "Your councillors trade doubts behind half-closed doors. A throne is easily sat upon; it is another matter to be believed. If the old empire's glory is to be restored in truth and not just in name, someone out there will have to be convinced -- or answered."
 saga_second_rome.1001.a:0 "Summon the court. I will hear their doubts openly."
 saga_second_rome.1001.b:0 "Let doubts fester unspoken. I have no patience for gossip."

 # saga_second_rome.1002 -- A Voice Denies You
 saga_second_rome.1002.t:0 "A Voice Denies You"
 saga_second_rome.1002.desc:0 "Word reaches your court that your claim to the purple has been denied outright, loudly enough that every hall from here to the coast has heard it. A throne unrecognized is a throne only half-held."
 saga_second_rome.1002.a:0 "Denounce them before my own court, and let all know I heard the insult."
 saga_second_rome.1002.b:0 "Ignore the insult. Let my deeds answer where words will not."

 # saga_second_rome.1003 -- The First Trial
 saga_second_rome.1003.t:0 "The First Trial"
 saga_second_rome.1003.desc:0 "An embassy from a neighboring realm arrives, ostensibly to pay respects -- in truth, to see whether your court can command awe or only argument. This is no idle theater. It is the first real test of whether the world will accept your empire as more than a fresh coat of paint over old stones."
 saga_second_rome.1003.a:0 "Stage a coronation worthy of the old emperors, whatever the cost."
 saga_second_rome.1003.b:0 "Answer their doubts with the ledgers and the roads, not spectacle."

 # saga_second_rome.1004 -- The Rival Musters Support
 saga_second_rome.1004.t:0 "The Rival Musters Support"
 saga_second_rome.1004.desc:0 "Your rival has stopped merely denying your claim and started campaigning against it -- letters to distant courts, gifts to wavering allies, quiet suggestions that your empire is a costume, not a crown. It is a war fought in council chambers rather than fields, and it is already underway."
 saga_second_rome.1004.a:0 "Send envoys of my own, court by court, and answer whisper with whisper."
 saga_second_rome.1004.b:0 "Let him waste his breath. My armies will speak for me when it matters."

 # saga_second_rome.1005 -- A Courtier's Wandering Eye
 saga_second_rome.1005.t:0 "A Courtier's Wandering Eye"
 saga_second_rome.1005.desc:0 "One of your own courtiers has been receiving gifts that did not come from you. Nothing said outright yet -- only a loosened tongue at the wrong dinner, a little too much curiosity about your plans. Your rival's coin has found a way through your own gates."
 saga_second_rome.1005.a:0 "Root out the traitor before the rot spreads further."
 saga_second_rome.1005.b:0 "Feed them false comfort, and let my rival believe he is winning."

 # saga_second_rome.1006 -- The Rival's Envoy
 saga_second_rome.1006.t:0 "The Rival's Envoy"
 saga_second_rome.1006.desc:0 "An envoy stands before your full court, sent by your rival to demand -- not request -- that you set aside the imperial title as a fraud unbecoming of your station. Every eye in the hall is on you, waiting to see if the demand lands or breaks against you."
 saga_second_rome.1006.a:0 "Answer the demand with dread. Let him carry that answer home."
 saga_second_rome.1006.b:0 "Offer polite nothings and send him away with no commitment made."

 # saga_second_rome.1007 -- Test of Arms
 saga_second_rome.1007.t:0 "Test of Arms"
 saga_second_rome.1007.desc:0 "Banners belonging to your rival's allies have been sighted mustering near your border -- not yet an invasion, but plainly a test of nerve, sent to see whether an emperor of paper flinches at the first show of steel. The whole court is watching to see what you do next."
 saga_second_rome.1007.a:0 "Muster my own banners in answer. Let them see we do not flinch."
 saga_second_rome.1007.b:0 "Reinforce the border quietly, and deny them the satisfaction of a spectacle."

 # saga_second_rome.1008 -- The Verdict of the Age (ending-fork prelude)
 saga_second_rome.1008.t:0 "The Verdict of the Age"
 saga_second_rome.1008.desc:0 "The rival's envoys have gone quiet, and the banners at the border have furled. In your own hall the whispers have thinned to a hush, and you have lived long enough among courts to know that hush is not peace. The age has finished asking whether you are truly emperor. It is about to answer."
 saga_second_rome.1008.a:0 "Stake all that remains on one last act of majesty."
 saga_second_rome.1008.b:0 "Let the answer come. I have done what could be done."

 # saga_second_rome.1009 -- The Acclamation (ENDING: recognized restorer)
 saga_second_rome.1009.t:0 "The Acclamation"
 saga_second_rome.1009.desc:0 "They fill the streets to see you as the old emperors were seen, and no one had to be paid to cheer. The envoys who once weighed your court with narrowed eyes now kneel in it, and the chroniclers have quietly struck out 'styled himself emperor' and written the plain word instead. Only you know the full price of it -- the years, the coin, the men -- and no chronicle will ever carry that ledger."
 saga_second_rome.1009.a:0 "Wear it as the old emperors wore it."
 saga_second_rome.1009.b:0 "Remember every hand that ever doubted."

 # saga_second_rome.1010 -- The Hollow Crown (ENDING: held, never believed)
 saga_second_rome.1010.t:0 "The Hollow Crown"
 saga_second_rome.1010.desc:0 "No herald denies you now; no army musters at your border; the title is yours for as long as you care to hold it. But you have watched your court bow at precisely the correct depth and not a finger's width lower, and you have read what the chroniclers write: 'he wore the purple' -- never 'he was Rome.' The empire stands. Only the belief in it never came."
 saga_second_rome.1010.a:0 "Rule on as though they believed."
 saga_second_rome.1010.b:0 "Build what will outlast their doubt."

 # saga_second_rome.1011 -- Another's Chronicle (ENDING: the rival prevails)
 saga_second_rome.1011.t:0 "Another's Chronicle"
 saga_second_rome.1011.desc:0 "The story has been decided, and it is not yours. In every court that matters the tale now runs the same way: a pretender reached for the purple, and one man stood and named the fraud aloud. Singers carry your rival's name from here to the coast, while yours survives as a single line in another man's chronicle. You still hold the throne; the story has already left the room."
 saga_second_rome.1011.a:0 "Endure. Chronicles are not the last word."
 saga_second_rome.1011.b:0 "Strike his name from every book my writ can reach."

 # saga_second_rome.1012 -- At Your Own Table (ENDING: dynasty schism)
 saga_second_rome.1012.t:0 "At Your Own Table"
 saga_second_rome.1012.desc:0 "It is not the rival who breaks you in the end -- he need only watch. A kinsman of your own house rises at your table and says aloud what half the hall has murmured for years: that if the purple can be taken by proclamation, it can be taken again, by blood no worse than yours. By nightfall the house has chosen sides along every old line of marriage, grievance, and inheritance. The empire you raised is dying at its own table, carved by the hands it was meant to feed."
 saga_second_rome.1012.a:0 "Cast them from house and hall."
 saga_second_rome.1012.b:0 "Yield a share, and keep the blood whole."

l_english:
 saga.1.t:0 "A Quiet Word"
 saga.1.desc:0 "A member of your court draws you aside, voice low. 'My lord, there is a matter best discussed away from other ears.' Their eyes flick to the door before they continue, weighing how much to say."
 saga.1.a:0 "Hear them out fully."
 saga.1.b:0 "Offer a blessing instead, and end the conversation."

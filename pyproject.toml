[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-forge"
version = "0.1.0"
description = "AI agents that build games, not just play them"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "GameForge Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "anthropic>=0.50.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "Pillow>=10.0",
    "aiofiles>=23.0",
    "aiosqlite>=0.19",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
forge = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*", "schemas*", "tools*", "state*"]

# Top-level single-module shims live next to the orchestrator package
# (claudex.py + claudex_anthropic_shim.py). Without explicitly listing
# them here, `pip install -e .` excludes them and the installed `forge`
# entry point breaks at import time on `import claudex_anthropic_shim`.
[tool.setuptools]
py-modules = ["claudex", "claudex_anthropic_shim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
